# SOURCE-ONLY DROP-IN BLUEPRINT.
# Applying this file changes the production trust boundary and requires a
# separate explicit owner authorization. It is deliberately not part of the
# default dashboard-rpi5-agent.service unit.

[Service]
SupplementaryGroups=
SupplementaryGroups=dashboard-rpi5-docker-client dashboard-rpi5-log-client
Environment=DASHBOARD_RPI5_LOG_BROKER_SOCKET=/run/dashboard-rpi5-log-broker/broker.sock
Environment=DASHBOARD_RPI5_PRIVILEGED_LOGS=enabled
