name: Phase 9E lockfile refresh

on:
  push:
    branches:
      - feat/phase9e-terminal-websocket-transport
    paths:
      - apps/server/package.json
      - .github/workflows/phase9e-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase9e-terminal-websocket-transport

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify manifest stayed exact
        run: git diff --exit-code -- apps/server/package.json

      - name: Commit generated lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/phase9e-lockfile.yml
          git commit -m "build: refresh lockfile for terminal websocket"
          git push origin HEAD:feat/phase9e-terminal-websocket-transport
