name: Phase 2A lockfile bootstrap

on:
  push:
    branches: [feat/phase2a-local-agent-protocol]
    paths:
      - .github/workflows/phase2a-lock-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: phase2a-lock-bootstrap
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase2a-local-agent-protocol

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lock metadata only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify manifests unchanged
        run: git diff --exit-code -- package.json 'apps/*/package.json' 'packages/*/package.json'

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "package-lock.json"

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock phase 2A agent dependencies"
          git push origin HEAD:feat/phase2a-local-agent-protocol
