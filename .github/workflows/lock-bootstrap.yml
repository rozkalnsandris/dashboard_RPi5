name: Lockfile bootstrap

on:
  push:
    branches:
      - feat/phase1-core-ui-foundation

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/phase1-core-ui-foundation
          persist-credentials: true

      - name: Require lockfile to be absent
        run: test ! -f package-lock.json

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify bootstrap scope
        run: |
          test -f package-lock.json
          git diff --exit-code -- package.json apps/agent/package.json apps/server/package.json apps/web/package.json packages/contracts/package.json

      - name: Commit only package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock phase 1 dependencies"
          git push origin HEAD:feat/phase1-core-ui-foundation
