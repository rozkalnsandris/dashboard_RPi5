name: Node24 lock sync

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/node24-lock-sync.yml

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Generate exact Node 24 lockfile blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rootTypes = lock.packages?.['']?.devDependencies?.['@types/node'];
          const installedTypes = lock.packages?.['node_modules/@types/node']?.version;
          const undici = lock.packages?.['node_modules/undici-types']?.version;
          if (rootTypes !== '24.13.3' || installedTypes !== '24.13.3') {
            throw new Error(`Node type lock mismatch root=${rootTypes} installed=${installedTypes}`);
          }
          if (typeof undici !== 'string' || !undici.startsWith('7.')) {
            throw new Error(`Unexpected undici-types for Node 24 declarations: ${undici}`);
          }
          console.log(`NODE24_LOCK_VERIFY_PASS types=${installedTypes} undici=${undici}`);
          NODE

          changed="$(git diff --name-only)"
          [ "$changed" = "package-lock.json" ] || {
            echo "BLOCKED: npm changed unexpected files: $changed" >&2
            exit 1
          }

          jq -Rs '{content: @base64, encoding: "base64"}' package-lock.json > /tmp/node24-lock-blob.json
          response="$(curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
            --data-binary @/tmp/node24-lock-blob.json)"
          blob_sha="$(printf '%s' "$response" | jq -er '.sha')"
          printf 'NODE24_LOCK_BLOB_SHA=%s\n' "$blob_sha"
