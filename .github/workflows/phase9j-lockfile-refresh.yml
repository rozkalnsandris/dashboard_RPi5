name: Phase 9J lockfile refresh

on:
  push:
    branches:
      - feat/phase9j-xterm-mobile-ui

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase9j-xterm-mobile-ui

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove one-shot workflow and commit generated lockfile
        run: |
          git rm .github/workflows/phase9j-lockfile-refresh.yml
          git add package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: refresh lockfile for xterm frontend'
          git push origin HEAD:feat/phase9j-xterm-mobile-ui
