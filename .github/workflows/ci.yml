name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate production candidate manifest
        env:
          DASHBOARD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/production-candidate-manifest.mjs --root . --sha "$DASHBOARD_CANDIDATE_SHA" > /tmp/dashboard-rpi5-production-candidate.json
          node tools/production-candidate-manifest.mjs --root . --sha "$DASHBOARD_CANDIDATE_SHA" --verify /tmp/dashboard-rpi5-production-candidate.json

      - name: Validate manifest-only base runtime
        env:
          DASHBOARD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/production-runtime-smoke.mjs \
            --root . \
            --manifest /tmp/dashboard-rpi5-production-candidate.json \
            --sha "$DASHBOARD_CANDIDATE_SHA"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive browser tests
        run: npm run test:e2e

  terminal-native:
    name: terminal-native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 build-essential

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Selectively build node-pty from source
        env:
          npm_config_build_from_source: "true"
        run: npm rebuild node-pty --foreground-scripts

      - name: Verify native PTY binding
        run: npm run test:native --workspace @dashboard-rpi5/terminal-agent
