name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: FAST-LANE classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      terminal_native: ${{ steps.scope.outputs.terminal_native }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          event = os.environ['EVENT_NAME']
          if event != 'pull_request':
              docs_only = False
              terminal_native = True
          else:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              if not base or not head:
                  raise SystemExit('missing pull request base/head SHA')
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMR', base, head],
                  text=True,
              ).splitlines()
              if not changed:
                  raise SystemExit('empty pull request diff')

              def is_docs(path: str) -> bool:
                  p = pathlib.PurePosixPath(path)
                  return (
                      p.suffix.lower() in {'.md', '.txt'}
                      or p.parts[:1] == ('docs',)
                  )

              docs_only = all(is_docs(path) for path in changed)
              terminal_native = any(
                  path.startswith('apps/terminal-agent/')
                  or path in {'.node-version', 'package.json', 'package-lock.json'}
                  or path.startswith('.github/workflows/')
                  for path in changed
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"docs_only={'true' if docs_only else 'false'}\n")
              output.write(f"terminal_native={'true' if terminal_native else 'false'}\n")
          print(f'FAST_LANE_DOCS_ONLY={str(docs_only).lower()}')
          print(f'FAST_LANE_TERMINAL_NATIVE={str(terminal_native).lower()}')
          PY

  check:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate production candidate manifest
        env:
          DASHBOARD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/production-candidate-manifest.mjs --root . --sha "$DASHBOARD_CANDIDATE_SHA" > /tmp/dashboard-rpi5-production-candidate.json
          node tools/production-candidate-manifest.mjs --root . --sha "$DASHBOARD_CANDIDATE_SHA" --verify /tmp/dashboard-rpi5-production-candidate.json

      - name: Validate manifest-only base runtime
        env:
          DASHBOARD_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tools/production-runtime-smoke.mjs \
            --root . \
            --manifest /tmp/dashboard-rpi5-production-candidate.json \
            --sha "$DASHBOARD_CANDIDATE_SHA"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive browser tests
        run: npm run test:e2e

  terminal-native:
    name: terminal-native (${{ matrix.arch }})
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.terminal_native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 build-essential

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Selectively build node-pty from source
        env:
          npm_config_build_from_source: "true"
        run: npm rebuild node-pty --foreground-scripts

      - name: Verify native PTY binding
        run: npm run test:native --workspace @dashboard-rpi5/terminal-agent

  fast-lane-merge-gate:
    name: FAST-LANE Merge Gate
    needs: [classify, check, terminal-native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required validation results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          TERMINAL_NATIVE: ${{ needs.classify.outputs.terminal_native }}
          CHECK_RESULT: ${{ needs.check.result }}
          TERMINAL_RESULT: ${{ needs.terminal-native.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$CHECK_RESULT" == skipped ]]
          else
            [[ "$CHECK_RESULT" == success ]]
          fi
          if [[ "$DOCS_ONLY" == true || "$TERMINAL_NATIVE" != true ]]; then
            [[ "$TERMINAL_RESULT" == skipped ]]
          else
            [[ "$TERMINAL_RESULT" == success ]]
          fi
          echo "FAST_LANE_MERGE_GATE=PASS"
