name: Issue 298 lockfile helper

on:
  push:
    branches:
      - fix/issue-298-dependency-audit
    paths:
      - apps/agent/package.json
      - apps/server/package.json
      - apps/web/package.json
      - .github/workflows/issue298-lockfile-helper.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Generate and commit audited lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_fix_status=$?
          set -e
          echo "npm audit fix exit code: $audit_fix_status"
          npm audit --audit-level=high
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == "package-lock.json" ]]
          npm ci --ignore-scripts
          npm audit --audit-level=high
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh audited lockfile (#298)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
