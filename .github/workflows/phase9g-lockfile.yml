name: Phase 9G lockfile refresh

on:
  push:
    branches:
      - feat/phase9g-native-linux-pty-adapter

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/phase9g-native-linux-pty-adapter

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/phase9g-lockfile.yml
          git commit -m "build: refresh isolated terminal-agent lockfile"
          git push origin HEAD:feat/phase9g-native-linux-pty-adapter
